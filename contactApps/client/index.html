<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .form-row input { flex: 1; min-width: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #cancelBtn { background: #6b7280; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f9fafb; }
        .action-btn { padding: 6px 10px; margin-right: 5px; font-size: 13px; }
        .edit-btn { background: #f59e0b; }
        .delete-btn { background: #dc2626; }
        .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .message.success { display: block; background: #d1fae5; color: #065f46; }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Management System</h1>
        <div id="message" class="message"></div>
        <form id="contactForm">
            <input type="hidden" id="contactMongoId" />
            <div class="form-row">
                <input type="text" id="name" placeholder="Name" />
                <input type="text" id="phone" placeholder="Phone (10 digits)" />
                <input type="text" id="email" placeholder="Email" />
                <button type="submit" id="submitBtn">Add Contact</button>
                <button type="button" id="cancelBtn" class="hidden">Cancel</button>
            </div>
        </form>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
            </thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>
    <script>
        const form = document.getElementById('contactForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const mongoIdInput = document.getElementById('contactMongoId');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const tableBody = document.getElementById('contactTableBody');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            setTimeout(() => { messageDiv.className = 'message'; }, 4000);
        }

        function validateForm() {
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();
            if (!name) { showMessage('Name is required.', 'error'); return false; }
            if (!/^\d{10}$/.test(phone)) { showMessage('Phone must contain exactly 10 digits.', 'error'); return false; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMessage('Please enter a valid email address.', 'error'); return false; }
            return true;
        }

        async function fetchContacts() {
            try {
                const res = await fetch('/contacts');
                const contacts = await res.json();
                tableBody.innerHTML = '';
                contacts.forEach((contact) => {
                    const row = document.createElement('tr');
                    row.innerHTML =
                        '<td>' + contact.contactId + '</td>' +
                        '<td>' + contact.name + '</td>' +
                        '<td>' + contact.phone + '</td>' +
                        '<td>' + contact.email + '</td>' +
                        '<td>' +
                        '<button class="action-btn edit-btn" data-id="' + contact._id + '" data-name="' + contact.name + '" data-phone="' + contact.phone + '" data-email="' + contact.email + '">Edit</button>' +
                        '<button class="action-btn delete-btn" data-id="' + contact._id + '">Delete</button>' +
                        '</td>';
                    tableBody.appendChild(row);
                });
            } catch (err) {
                showMessage('Failed to load contacts.', 'error');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validateForm()) return;
            const contactData = { name: nameInput.value.trim(), phone: phoneInput.value.trim(), email: emailInput.value.trim() };
            try {
                const mongoId = mongoIdInput.value;
                let res;
                if (mongoId) {
                    res = await fetch('/contacts/' + mongoId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(contactData) });
                } else {
                    res = await fetch('/contacts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(contactData) });
                }
                const result = await res.json();
                if (res.ok) {
                    showMessage(result.message, 'success');
                    form.reset();
                    mongoIdInput.value = '';
                    submitBtn.textContent = 'Add Contact';
                    cancelBtn.classList.add('hidden');
                    fetchContacts();
                } else {
                    showMessage(result.error || 'Something went wrong.', 'error');
                }
            } catch (err) {
                showMessage('Server error. Please try again.', 'error');
            }
        });

        tableBody.addEventListener('click', async (e) => {
            if (e.target.classList.contains('edit-btn')) {
                nameInput.value = e.target.dataset.name;
                phoneInput.value = e.target.dataset.phone;
                emailInput.value = e.target.dataset.email;
                mongoIdInput.value = e.target.dataset.id;
                submitBtn.textContent = 'Update Contact';
                cancelBtn.classList.remove('hidden');
            }
            if (e.target.classList.contains('delete-btn')) {
                if (confirm('Are you sure you want to delete this contact?')) {
                    try {
                        const res = await fetch('/contacts/' + e.target.dataset.id, { method: 'DELETE' });
                        const result = await res.json();
                        if (res.ok) { showMessage(result.message, 'success'); fetchContacts(); }
                        else { showMessage(result.error || 'Failed to delete.', 'error'); }
                    } catch (err) {
                        showMessage('Server error. Please try again.', 'error');
                    }
                }
            }
        });

        cancelBtn.addEventListener('click', () => {
            form.reset();
            mongoIdInput.value = '';
            submitBtn.textContent = 'Add Contact';
            cancelBtn.classList.add('hidden');
        });

        fetchContacts();
    </script>
</body>
</html>
